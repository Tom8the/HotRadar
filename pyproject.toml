[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hotradar"
version = "1.2.0"
description = "A local hot-topic and trend intelligence dashboard for MCN teams"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
  "cryptography>=44,<50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
browser-auth = ["playwright>=1.51,<2"]
session-export = [
    "playwright>=1.51,<2",
]

[project.scripts]
hotradar-worker = "hotradar.worker:main"
hotradar-seed = "hotradar.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/hotradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
