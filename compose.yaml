name: hotradar
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotradar
      POSTGRES_USER: hotradar
      POSTGRES_PASSWORD: ${HOTRADAR_DB_PASSWORD:?Run scripts/configure-local.ps1 first}
    ports:
      - "127.0.0.1:${HOTRADAR_DB_PORT:-18814}:5432"
    volumes:
      - hotradar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotradar -d hotradar"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  hotradar_postgres:
